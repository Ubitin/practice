<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图 DFS 深度优先搜索 · 交互动画</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2b; --line:#26314a; --txt:#e6ecf7; --dim:#8fa0bd;
    --ok:#2f9e44; --bad:#c92a2a; --warn:#f0a020; --blue:#3b82f6; --purple:#a855f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
  header{padding:14px 18px 8px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:18px}
  .sub{color:var(--dim);font-size:13px}
  .wrap{display:grid;grid-template-columns:minmax(420px,1.35fr) minmax(320px,1fr);
        gap:12px;padding:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .card h2{margin:0 0 8px;font-size:14px;color:var(--dim);font-weight:600}
  svg{width:100%;height:auto;display:block}
  .node circle{stroke:#0b1020;stroke-width:2;transition:fill .12s}
  .node text{font-size:15px;font-weight:700;fill:#0b1020;text-anchor:middle;dominant-baseline:central}
  .edge{stroke-width:3;transition:stroke .12s,stroke-width .12s}
  .edge.tree{stroke:var(--ok)}
  .edge.back{stroke:var(--bad);stroke-dasharray:7 5}
  .edge.forward{stroke:var(--blue);stroke-dasharray:2 4}
  .edge.cross{stroke:var(--purple);stroke-dasharray:10 4 2 4}
  .edge.repeat{stroke:#5b6780;stroke-dasharray:3 5}
  .edge.none{stroke:#39445c}
  .edge.cur{stroke:var(--warn);stroke-width:6;stroke-dasharray:none}
  .curdot{fill:var(--warn)}
  .stackbox{display:flex;flex-direction:column-reverse;gap:6px;min-height:150px}
  .sf{display:flex;justify-content:space-between;align-items:center;gap:8px;
      background:#101728;border:1px solid var(--line);border-radius:8px;padding:5px 9px}
  .sf.top{border-color:var(--warn)}
  .sf b{color:var(--warn)}
  .sf .p{color:var(--dim);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
  th{color:var(--dim);font-weight:600}
  .tag{display:inline-block;padding:0 6px;border-radius:6px;font-size:12px;margin-right:4px}
  .t-tree{background:#15351f;color:#59d17b}
  .t-back{background:#3a1616;color:#ff8b8b}
  .t-forward{background:#152a45;color:#7fb6ff}
  .t-cross{background:#2c1a3d;color:#c79bff}
  .t-repeat{background:#232a3a;color:#9fb0cc}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dim)}
  .bar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line);
       background:#121828;flex-wrap:wrap;position:sticky;bottom:0}
  button{background:#1e2740;color:var(--txt);border:1px solid var(--line);border-radius:8px;
         padding:6px 12px;font-size:13px;cursor:pointer}
  button:hover{background:#26314a}
  button:disabled{opacity:.4;cursor:default}
  select,input[type=number]{background:#1e2740;color:var(--txt);border:1px solid var(--line);
         border-radius:8px;padding:5px 8px;font-size:13px}
  .msg{padding:12px 18px;background:#121828;border-top:1px solid var(--line);font-size:14px;min-height:46px}
  .msg b{color:var(--warn)}
  .prog{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
  .order span{display:inline-block;background:#101728;border:1px solid var(--line);
              border-radius:6px;padding:1px 7px;margin:0 4px 4px 0;font-variant-numeric:tabular-nums}
  .order span.now{border-color:var(--warn);color:var(--warn)}
  .order span.done{border-color:#2f9e44;color:#59d17b}
</style>
</head>
<body>
<header>
  <h1>图 DFS 深度优先搜索 · 交互动画</h1>
  <div class="sub">一条路走到黑、走不通就退回上一层换路。右侧的「递归栈」就是 DFS 的灵魂。</div>
</header>

<div class="wrap">
  <div class="card">
    <h2>图（节点颜色＝状态：白＝没访问过，橙＝在栈上，绿＝已完成）</h2>
    <svg id="g" viewBox="0 0 760 400" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend" style="margin-top:8px">
      <span><span class="tag t-tree">树边</span>发现了新点</span>
      <span><span class="tag t-back">回边</span>指向栈上的点 → <b>有环</b></span>
      <span><span class="tag t-forward">前向边</span>指向自己的后代（有向图）</span>
      <span><span class="tag t-cross">横叉边</span>指向别的分支（有向图）</span>
      <span><span class="tag t-repeat">回看的边</span>对面早就走过来了</span>
    </div>
  </div>

  <div>
    <div class="card" style="margin-bottom:12px">
      <h2>递归栈（最上面＝当前节点；括号里是"看到第几个邻居了"）</h2>
      <div class="stackbox" id="stack"></div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <h2>访问顺序（先根序）与时间戳</h2>
      <div class="order" id="order"></div>
      <table id="ts"></table>
    </div>
    <div class="card">
      <h2>边分类统计</h2>
      <div id="stat"></div>
    </div>
  </div>
</div>

<div class="msg" id="msg">点「单步」或「播放」开始。</div>

<div class="bar">
  <button id="bReset">⏮ 重置</button>
  <button id="bBack">◀ 后退</button>
  <button id="bPlay">▶ 播放</button>
  <button id="bStep">▶| 单步</button>
  <label class="prog">帧 <input id="frame" type="number" min="0" style="width:74px"> / <span id="total">0</span></label>
  <label class="prog">速度 <input id="speed" type="range" min="1" max="10" value="5" style="vertical-align:middle"></label>
  <label class="prog">起点 <select id="start"></select></label>
  <label class="prog">图 <select id="mode">
    <option value="undirected">无向图（8 点 / 2 个连通块）</option>
    <option value="directed">有向图（5 点 / 四种边都有）</option>
  </select></label>
  <span class="prog" id="deep"></span>
</div>

<script>
const SIM = (function () {
  // ---------- 两份固定的图（坐标写死，方便画） ----------
  const G = {
    undirected: {
      n: 8, directed: false,
      pos: [[200,75],[85,195],[315,195],[30,330],[165,330],[265,330],[580,110],[680,265]],
      adj: [[1,2],[0,3,4],[0,5],[1],[1,5],[2,4],[7],[6]],
      edges: [[0,1],[0,2],[1,3],[1,4],[2,5],[4,5],[6,7]]
    },
    directed: {
      n: 5, directed: true,
      pos: [[150,80],[430,80],[480,250],[110,250],[280,350]],
      adj: [[1,2,3],[2,4],[4],[4],[0]],
      edges: [[0,1],[0,2],[0,3],[1,2],[1,4],[2,4],[3,4],[4,0]]
    }
  };

  const CN = { tree: '树边', back: '回边', forward: '前向边', cross: '横叉边', repeat: '回看的边' };

  function run(mode, start) {
    const g = G[mode], n = g.n, adj = g.adj;
    const state = new Array(n).fill(0);      // 0 白 / 1 橙（在栈上）/ 2 绿（完成）
    const tin = new Array(n).fill(0), tout = new Array(n).fill(0);
    const par = new Array(n).fill(-1);
    const ptr = new Array(n).fill(-1);       // 每个点看到第几个邻居
    const stack = [], order = [], frames = [];
    const et = {};                           // "u-v" -> 边类型
    const cnt = { tree: 0, back: 0, forward: 0, cross: 0, repeat: 0 };
    let timer = 0;

    const isDesc = (u, v) => {               // v 是不是 u 的后代
      let x = v;
      while (par[x] !== -1) { x = par[x]; if (x === u) return true; }
      return false;
    };
    const snap = (o) => frames.push(Object.assign({
      state: state.slice(), tin: tin.slice(), tout: tout.slice(),
      ptr: ptr.slice(), stack: stack.slice(), order: order.slice(),
      et: Object.assign({}, et), cnt: Object.assign({}, cnt),
      u: -1, v: -1, cls: null, msg: ''
    }, o));

    snap({ msg: '预备：所有点都是白色（没访问过）。DFS 从起点出发，一条路走到黑。' });

    function dfs(u) {
      state[u] = 1; tin[u] = ++timer; order.push(u); stack.push(u);
      if (stack.length === 1) par[u] = -1;
      snap({ kind: 'push', u, msg: '发现 ' + u + '：染橙、tin[' + u + ']=' + tin[u] + '、压入递归栈（第 ' + stack.length + ' 层）' });
      for (ptr[u] = 0; ptr[u] < adj[u].length; ptr[u]++) {
        const v = adj[u][ptr[u]];
        let cls;
        if (state[v] === 0) cls = 'tree';
        else if (state[v] === 1) cls = 'back';
        else cls = g.directed ? (isDesc(u, v) ? 'forward' : 'cross') : 'repeat';
        et[u + '-' + v] = cls;
        cnt[cls]++;
        let msg = '考察边 ' + u + '→' + v + '：' + CN[cls] + '。';
        if (cls === 'tree') msg += ' ' + v + ' 还是白的 → 往下钻（这就是"一条路走到黑"）。';
        else if (cls === 'back') msg += ' ' + v + ' 还在栈上（是 ' + u + ' 的祖先）→ 说明这里有一个环！';
        else if (cls === 'forward') msg += ' ' + v + ' 是 ' + u + ' 的后代且已完成。';
        else if (cls === 'cross') msg += ' ' + v + ' 已完成，且不是 ' + u + ' 的后代 → 属于别的分支。';
        else msg += ' 这条边在对面早就被当成回边看过了（无向图同一条边会被看两次）。';
        snap({ kind: 'examine', u, v, cls, msg });
        if (cls === 'tree') { par[v] = u; dfs(v); }
      }
      stack.pop(); state[u] = 2; tout[u] = ++timer;
      snap({ kind: 'pop', u, msg: u + ' 的邻居全看完了 → 染绿、tout[' + u + ']=' + tout[u] + '、弹出递归栈（退回上一层）' });
    }

    dfs(start);
    // 外层循环：还有白点就再开一棵树（连通块）
    for (let s = 0; s < n; s++) {
      if (state[s] === 0) {
        snap({ kind: 'comp', msg: '所有点都走完了？检查一遍：还有白色的点 ' + s + ' → 说明它是【另一个连通块】，从它再开一棵 DFS 树。' });
        dfs(s);
      }
    }
    snap({ msg: '结束：所有点都变绿了。时间戳一共用了 ' + timer + ' 个（每个点进出各一次 ⇒ 2n）。' });
    return { frames, g, CN };
  }

  return { GRAPHS: G, run, CN };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = SIM;

/* ================= 以下是界面部分（node 里跑不到） ================= */
if (typeof document !== 'undefined') {
  const $ = (s) => document.querySelector(s);
  const NS = 'http://www.w3.org/2000/svg';
  let mode = 'undirected', start = 0, cur = 0, timer = null, R = null;

  function buildSelectors() {
    $('#mode').innerHTML = Object.keys(SIM.GRAPHS).map(k =>
      '<option value="' + k + '">' + (k === 'undirected' ? '无向图（8 点 / 2 个连通块）' : '有向图（5 点 / 四种边都有）') + '</option>').join('');
    $('#mode').value = mode;
    const n = SIM.GRAPHS[mode].n;
    $('#start').innerHTML = Array.from({ length: n }, (_, i) => '<option value="' + i + '">' + i + '</option>').join('');
    $('#start').value = start;
  }

  function el(tag, attrs, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function drawStatic() {
    const g = R.g, svg = $('#g');
    svg.innerHTML = '';
    const defs = el('defs');
    const mk = el('marker', { id: 'arw' + (g.directed ? 'd' : 'u'), viewBox: '0 0 10 10', refX: '26', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' });
    mk.appendChild(el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: '#8fa0bd' }));
    defs.appendChild(mk); svg.appendChild(defs);
    g.edges.forEach(([a, b], i) => {
      const p = el('line', { x1: g.pos[a][0], y1: g.pos[a][1], x2: g.pos[b][0], y2: g.pos[b][1], class: 'edge none', id: 'e' + i });
      if (g.directed) p.setAttribute('marker-end', 'url(#arw' + 'd)');
      svg.appendChild(p);
    });
    for (let u = 0; u < g.n; u++) {
      const grp = el('g', { class: 'node', id: 'n' + u });
      grp.appendChild(el('circle', { cx: g.pos[u][0], cy: g.pos[u][1], r: 21 }));
      grp.appendChild(el('text', { x: g.pos[u][0], y: g.pos[u][1] }, String(u)));
      svg.appendChild(grp);
    }
    // 起点的星标
  }

  const FILL = ['#e6ecf7', '#f0a020', '#2f9e44'];

  function render() {
    const f = R.frames[cur], g = R.g;
    // 节点
    for (let u = 0; u < g.n; u++) {
      const c = document.querySelector('#n' + u + ' circle');
      c.setAttribute('fill', FILL[f.state[u]]);
      c.setAttribute('stroke', f.stack[f.stack.length - 1] === u ? '#f0a020' : '#0b1020');
      c.setAttribute('stroke-width', f.stack[f.stack.length - 1] === u ? 5 : 2);
    }
    // 边
    g.edges.forEach(([a, b], i) => {
      const ln = document.getElementById('e' + i);
      const t = f.et[a + '-' + b] || f.et[b + '-' + a];
      ln.setAttribute('class', 'edge ' + (t || 'none'));
      if (g.directed) {
        ln.setAttribute('x1', g.pos[a][0]); ln.setAttribute('y1', g.pos[a][1]);
        ln.setAttribute('x2', g.pos[b][0]); ln.setAttribute('y2', g.pos[b][1]);
      }
    });
    // 当前考察的边高亮
    if (f.kind === 'examine') {
      g.edges.forEach(([a, b], i) => {
        const ln = document.getElementById('e' + i);
        if ((a === f.u && b === f.v) || (a === f.v && b === f.u)) ln.setAttribute('class', 'edge cur');
      });
    }
    // 递归栈
    $('#stack').innerHTML = f.stack.map((u, i) => {
      const top = i === f.stack.length - 1;
      const p = f.ptr[u] < 0 ? '还没开始看邻居' : '看到第 ' + (f.ptr[u] + 1) + ' / ' + g.adj[u].length + ' 个邻居';
      return '<div class="sf' + (top ? ' top' : '') + '"><span>' + (top ? '<b>' + u + '</b>（当前）' : u) + '</span><span class="p">' + p + '</span></div>';
    }).join('') || '<div class="p" style="color:var(--dim)">（空）</div>';
    // 访问顺序
    const last = f.order[f.order.length - 1];
    $('#order').innerHTML = f.order.map(u => '<span class="' + (f.tout[u] ? 'done' : (u === last ? 'now' : '')) + '">' + u + '</span>').join('') || '<span style="color:var(--dim)">（还没有）</span>';
    // 时间戳表
    let rows = '<tr><th>点</th><th>状态</th><th>tin</th><th>tout</th><th>邻居表</th></tr>';
    for (let u = 0; u < g.n; u++) {
      const st = ['白（未访问）', '橙（在栈上）', '绿（已完成）'][f.state[u]];
      rows += '<tr><td><b>' + u + '</b>' + (u === start ? ' ★' : '') + '</td><td>' + st + '</td><td>' + (f.tin[u] || '-') + '</td><td>' + (f.tout[u] || '-') + '</td><td>' +
        g.adj[u].map((v, i) => (i === f.ptr[u] ? '[' + v + ']' : v)).join(' ') + '</td></tr>';
    }
    $('#ts').innerHTML = rows;
    // 统计
    $('#stat').innerHTML = ['tree', 'back', 'forward', 'cross', 'repeat'].filter(k => R.g.directed || (k !== 'forward' && k !== 'cross'))
      .map(k => '<div style="margin:2px 0"><span class="tag t-' + k + '">' + SIM.CN[k] + '</span> ' + f.cnt[k] + ' 条' +
        (k === 'back' && f.cnt.back > 0 ? ' <span style="color:var(--dim)">（回边 > 0 ⇒ 图里有环）</span>' : '') + '</div>').join('');
    // 解说 & 帧号
    $('#msg').innerHTML = f.msg;
    $('#frame').value = cur; $('#total').textContent = R.frames.length - 1;
    $('#deep').textContent = '#f=' + cur;
    $('#bBack').disabled = cur === 0; $('#bStep').disabled = cur >= R.frames.length - 1;
  }

  function reset(keepPlaying) {
    R = SIM.run(mode, start);
    cur = 0;
    drawStatic();
    render();
    if (!keepPlaying) stop();
    const h = parseInt((location.hash.match(/#f=(\d+)/) || [])[1], 10);
    if (!isNaN(h) && h < R.frames.length) { cur = h; render(); }
  }
  function goto(i) { cur = Math.max(0, Math.min(R.frames.length - 1, i)); render(); location.hash = '#f=' + cur; }
  function stop() { if (timer) { clearInterval(timer); timer = null; } $('#bPlay').textContent = '▶ 播放'; }
  function play() {
    if (timer) { stop(); return; }
    $('#bPlay').textContent = '⏸ 暂停';
    timer = setInterval(() => { if (cur >= R.frames.length - 1) stop(); else goto(cur + 1); }, 1050 - $('#speed').value * 100);
  }

  $('#bReset').onclick = () => reset();
  $('#bBack').onclick = () => goto(cur - 1);
  $('#bStep').onclick = () => goto(cur + 1);
  $('#bPlay').onclick = play;
  $('#speed').oninput = () => { if (timer) { stop(); play(); } };
  $('#frame').onchange = (e) => goto(parseInt(e.target.value, 10) || 0);
  $('#start').onchange = (e) => { start = parseInt(e.target.value, 10); reset(); };
  $('#mode').onchange = (e) => { mode = e.target.value; start = 0; buildSelectors(); reset(); };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); goto(cur + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goto(cur - 1); }
    if (e.key === ' ') { e.preventDefault(); play(); }
    if (e.key === 'r' || e.key === 'R') reset();
  });

  buildSelectors();
  reset();
}
</script>
</body>
</html>
