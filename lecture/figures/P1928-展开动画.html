<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P1928 外星密码 · 递归展开动画</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --line:#26314a; --fg:#e6ecf7; --dim:#8b9ab5;
    --accent:#5cc8ff; --warn:#ffcc66; --ok:#5ddc9a; --pop:#ff7ab6;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:18px 20px 40px;background:var(--bg);color:var(--fg);
       font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px;line-height:1.6}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .label{font-size:12px;color:var(--dim);margin-bottom:8px;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}

  /* 输入磁带 */
  .tape{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;font-family:Consolas,monospace}
  .cell{min-width:26px;height:34px;display:flex;align-items:center;justify-content:center;
        border-radius:6px;border:1px solid var(--line);background:#1b2437;font-size:16px;position:relative}
  .cell.done{opacity:.35}
  .cell.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(92,200,255,.35);background:#233149}
  .cell.br{color:var(--warn)}
  .cell.digit{color:var(--accent)}
  .caret{width:26px;text-align:center;color:var(--accent);font-size:12px;font-family:Consolas,monospace}
  .caretrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}

  /* 递归栈 */
  .stack{display:flex;flex-direction:column;gap:8px}
  .frame{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;background:#121a29}
  .frame.active{border-style:solid;border-color:var(--accent);background:#16233a}
  .frame .head{font-size:13px;color:var(--fg);display:flex;justify-content:space-between;gap:8px}
  .frame .body{font-family:Consolas,monospace;font-size:13px;color:var(--ok);margin-top:6px;word-break:break-all}
  .tag{font-size:11px;color:var(--dim)}
  .tag.pending{color:var(--warn)}

  .narration{font-size:14px;line-height:1.7;min-height:64px}
  .narration b{color:var(--accent)}
  .narration .hl{color:var(--pop)}
  .cur{font-family:Consolas,monospace;font-size:14px;color:var(--ok);word-break:break-all;min-height:28px}
  .result{font-family:Consolas,monospace;font-size:15px;color:var(--ok);word-break:break-all;min-height:30px}
  .result .len{color:var(--dim);font-size:12px;margin-left:8px}

  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
  button,select,input[type=text]{background:#1e2941;color:var(--fg);border:1px solid var(--line);
      border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  button:hover{background:#26344f}
  button.primary{background:#1d4b6b;border-color:#2b6d95}
  input[type=text]{cursor:text;min-width:180px;font-family:Consolas,monospace}
  input[type=range]{width:130px;vertical-align:middle}
  .progress{font-size:12px;color:var(--dim)}
  .legend{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.8}
  code{background:#1b2437;border-radius:4px;padding:1px 5px;font-family:Consolas,monospace}
</style>
</head>
<body>
  <h1>P1928 外星密码 · 递归展开动画</h1>
  <div class="sub">
    规则：连续的 D 个相同子串 X（2 ≤ D ≤ 99）压缩成 <code>[DX]</code>，X 内可再压缩（可嵌套）。<br>
    动画演示 <code>expand()</code> 的执行：<b>遇 '[' 下钻一层</b>、<b>遇 ']' 回退一层</b>、<b>把返回的 X 重复 D 次拼上</b>。
  </div>

  <div class="panel">
    <div class="label">① 输入串（高亮格 = 当前读到的字符，已读过的变暗）</div>
    <div id="tape" class="tape"></div>
    <div id="warn" class="tag" style="color:var(--warn);margin-top:10px"></div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="label">② 递归栈（每一层都在各自拼自己的 X）</div>
      <div id="stack" class="stack"></div>
    </div>
    <div class="panel">
      <div class="label">③ 当前动作</div>
      <div id="narration" class="narration"></div>
      <div class="label" style="margin-top:12px">④ 当前层的产物（= 这一层正在拼的 X）</div>
      <div id="cur" class="cur"></div>
      <div class="label" style="margin-top:12px">⑤ 最终结果（第 0 层已拼好的部分，实时增长）</div>
      <div id="result" class="result"></div>
    </div>
  </div>

  <div class="panel">
    <div class="controls">
      <button id="play" class="primary">▶ 播放</button>
      <button id="step">⏭ 单步</button>
      <button id="back">⏮ 上一步</button>
      <button id="reset">⟲ 重置</button>
      <label class="tag">速度 <input id="speed" type="range" min="80" max="1600" step="20" value="700"></label>
      <select id="example">
        <option value="AC[3FUN]">AC[3FUN]（官方样例）</option>
        <option value="ABF[4RA[2A]B[3C]]" selected>ABF[4RA[2A]B[3C]]（教材例）</option>
        <option value="[2[2[2AB]]]">[2[2[2AB]]]（三层嵌套）</option>
        <option value="[12XY]">[12XY]（两位数 D）</option>
        <option value="[2A]B[3C]">[2A]B[3C]（两个并排压缩区）</option>
        <option value="ABCDEF">ABCDEF（无压缩）</option>
      </select>
      <input id="custom" type="text" placeholder="也可以自己输入，如 2[2CB]">
      <button id="load">载入</button>
      <span class="progress" id="progress"></span>
    </div>
    <div class="legend">
      键盘：<code>空格</code> 播放/暂停、<code>→</code> 单步、<code>←</code> 上一步、<code>R</code> 重置。
      长串会折叠显示为 <code>开头…结尾（共 n 字）</code>，避免撑爆版面。
    </div>
  </div>

<script>
// ============ 1. 记录式递归下降：与 C++ 版顺序完全一致，只是把每一步存下来 ============
function buildSteps(input){
  const steps = [];
  let pos = 0;
  const stack = [];

  const snap = () => ({
    pos,
    stack: stack.map(f => ({ level:f.level, s:f.s, D:f.D, waiting:f.waiting }))
  });
  const push = (ev) => { steps.push(Object.assign(snap(), ev)); };

  function expand(level){
    const frame = { level, s:'', D:null, waiting:false };
    stack.push(frame);
    push({ type:'enter', level });

    while (pos < input.length){
      const ch = input[pos];
      push({ type:'read', level, ch });

      if (ch === '['){
        pos++;                                   // 吃掉 '['
        let num = '';
        while (pos < input.length && input[pos] >= '0' && input[pos] <= '9'){ num += input[pos]; pos++; }
        const D = parseInt(num || '0', 10);
        frame.D = D; frame.waiting = true;
        push({ type:'readD', level, D });

        const X = expand(level + 1);             // ← 递归：只调用一次

        frame.waiting = false;
        push({ type:'repeat', level, D, X });
        frame.s += X.repeat(D);                  // ← 重复拼接展开结果
        push({ type:'appendRepeated', level, D, X, s: frame.s });

      } else if (ch === ']'){
        pos++;                                   // 吃掉 ']'
        const val = frame.s;
        stack.pop();
        push({ type:'exit', level, value: val });
        return val;

      } else {
        frame.s += ch;                           // 普通字符
        pos++;
        push({ type:'append', level, ch, s: frame.s });
      }
    }

    const val = frame.s;
    stack.pop();
    push({ type:'exitEOF', level, value: val });
    return val;
  }

  const result = expand(0);
  push({ type:'done', result });
  return { steps, result };
}

// ============ 1b. 输入格式检查（本题格式是 [DX]：D 必须写在方括号内） ============
function validate(s){
  let depth = 0;
  for (let i = 0; i < s.length; i++){
    if (s[i] === '['){
      depth++;
      if (!(s[i+1] >= '0' && s[i+1] <= '9'))
        return "⚠️ 格式提示：'[' 后面必须紧跟重复次数 D——本题合法格式是 [DX]，例如 [3CBCB]。" +
               "像 3[CBCB] 这种把 D 写在方括号外的写法不是合法输入。";
    } else if (s[i] === ']'){
      depth--;
      if (depth < 0) return '⚠️ 括号不匹配：多了一个 ]';
    }
  }
  if (depth !== 0) return '⚠️ 括号不匹配：有未闭合的 [';
  return '';
}

// ============ 2. 渲染 ============
const $ = id => document.getElementById(id);
const EXAMPLES = {};

let input = '';
let steps = [];
let idx = 0;
let timer = null;

function fold(s, head = 34, tail = 22){
  if (s.length <= head + tail + 3) return s;
  return s.slice(0, head) + ' … ' + s.slice(-tail) + `（共 ${s.length} 字）`;
}

function renderTape(st){
  const tape = $('tape');
  tape.innerHTML = '';
  const caret = document.createElement('div');
  caret.className = 'caretrow';
  caret.id = 'caretrow';

  [...input].forEach((ch, i) => {
    const d = document.createElement('div');
    d.className = 'cell';
    if (i < st.pos) d.classList.add('done');
    if (i === st.pos) d.classList.add('cur');
    if (ch === '[' || ch === ']') d.classList.add('br');
    if (ch >= '0' && ch <= '9') d.classList.add('digit');
    d.textContent = ch === ' ' ? '␣' : ch;
    tape.appendChild(d);

    const c = document.createElement('div');
    c.className = 'caret';
    c.textContent = (i === st.pos) ? '▲' : '';
    caret.appendChild(c);
  });
  tape.appendChild(caret);
}

function renderStack(st){
  const box = $('stack');
  box.innerHTML = '';
  if (!st.stack.length){
    box.innerHTML = '<div class="tag">（递归栈为空：所有层都返回了）</div>';
    return;
  }
  st.stack.forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'frame' + (i === st.stack.length - 1 ? ' active' : '');
    const state = f.waiting ? `<span class="tag pending">等内层 X（D=${f.D}）</span>`
                            : (f.D != null ? `<span class="tag">已拿到 X，D=${f.D}</span>` : `<span class="tag">正在读取</span>`);
    el.innerHTML = `
      <div class="head"><span>第 ${f.level} 层 expand()</span>${state}</div>
      <div class="body">${f.s ? fold(f.s) : '<span class="tag">（还是空的）</span>'}</div>`;
    box.appendChild(el);
  });
}

function narrate(s){
  switch (s.type){
    case 'enter':  return `进入 <b>第 ${s.level} 层</b>，开始构建这一层的 X。`;
    case 'read':   return `读到字符 <b>'${s.ch === ' ' ? '␣' : s.ch}'</b>${s.ch === '[' ? ' → 这是一个压缩区的开始' : s.ch === ']' ? ' → 压缩区结束' : ' → 普通字符'}`;
    case 'readD':  return `读入重复次数 <b>D = ${s.D}</b>，接下来<b>递归下钻</b>去读内层的 X（第 ${s.level + 1} 层）。`;
    case 'repeat': return `第 ${s.level + 1} 层返回 <span class="hl">X = "${fold(s.X)}"</span>，现在把它<b>重复 ${s.D} 次</b>。`;
    case 'appendRepeated': return `拼好了：<span class="hl">"${fold(s.X)}" × ${s.D}</span> → 第 ${s.level} 层现在有 <b>${s.s.length}</b> 个字符。`;
    case 'append': return `普通字符 <b>'${s.ch}'</b> 直接接到本层 X 末尾。`;
    case 'exit':   return `读到 <b>']'</b> → 第 ${s.level} 层结束，把 <span class="hl">X = "${fold(s.value)}"</span> 交回上层。`;
    case 'exitEOF':return `读到<b>输入末尾（EOF）</b> → 第 ${s.level} 层结束，返回 <span class="hl">"${fold(s.value)}"</span>。`;
    case 'done':   return `全部读完！原文 = <span class="hl">"${fold(s.result, 60, 30)}"</span>（共 ${s.result.length} 字）`;
  }
  return '';
}

function render(){
  const st = steps[idx];
  renderTape(st);
  renderStack(st);
  $('narration').innerHTML = narrate(st);
  const top = st.stack.length ? st.stack[st.stack.length - 1] : null;
  $('cur').textContent = top ? fold(top.s, 60, 30) : '—';
  const root = st.stack.length ? st.stack[0].s : (st.result || '');
  $('result').innerHTML = (root ? fold(root, 80, 40) : '<span class="tag">（还没开始拼）</span>')
      + (st.type === 'done' ? `<span class="len">共 ${st.result.length} 字</span>` : '');
  $('progress').textContent = `第 ${idx + 1} / ${steps.length} 步`;
}

// ============ 3. 控制 ============
function load(text){
  input = text;
  $('warn').textContent = validate(text);
  const r = buildSteps(input);
  steps = r.steps;
  idx = 0;
  stop();
  render();
}
function stop(){ if (timer){ clearInterval(timer); timer = null; $('play').textContent = '▶ 播放'; } }
function play(){
  if (timer){ stop(); return; }
  $('play').textContent = '⏸ 暂停';
  timer = setInterval(() => {
    if (idx >= steps.length - 1){ stop(); return; }
    idx++; render();
  }, Number($('speed').value));
}
$('play').onclick = play;
$('step').onclick = () => { stop(); if (idx < steps.length - 1){ idx++; render(); } };
$('back').onclick = () => { stop(); if (idx > 0){ idx--; render(); } };
$('reset').onclick = () => { stop(); idx = 0; render(); };
$('speed').oninput = () => { if (timer){ stop(); play(); } };
$('example').onchange = e => { $('custom').value = ''; load(e.target.value); };
$('load').onclick = () => {
  const v = $('custom').value.trim();
  if (v){ $('example').selectedIndex = -1; load(v); }
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space'){ e.preventDefault(); play(); }
  else if (e.code === 'ArrowRight'){ $('step').click(); }
  else if (e.code === 'ArrowLeft'){ $('back').click(); }
  else if (e.key === 'r' || e.key === 'R'){ $('reset').click(); }
});

load($('example').value);
</script>
</body>
</html>
