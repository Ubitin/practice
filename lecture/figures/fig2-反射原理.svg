<text x="134.0" y="380.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14.0" fill="#16a34a" text-anchor="start" font-weight="400"><tspan>② 关于 y = x + 1 作镜像</tspan></text>
