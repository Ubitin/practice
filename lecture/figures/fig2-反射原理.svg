<text x="28.0" y="70.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14.5" fill="#64748b" text-anchor="start" font-weight="400"><tspan>把「起点到首次碰到 y = x + 1 的那一段」关于该直线作镜像，越界路径与从 (−1,1) 出发的路径一一对应</tspan></text>
