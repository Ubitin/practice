<text x="658.0" y="217.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="400"><tspan>C(2n, n) = C(8, 4) = 70</tspan></text>
<circle cx="646.0" cy="243.0" r="3.4" fill="#dc2626" stroke="none" stroke-width="1.0" opacity="1.00"/>
<text x="658.0" y="248.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14.5" fill="#0f172a" text-anchor="start" font-weight="400"><tspan>坏路径（越过对角线）</tspan></text>
<text x="658.0" y="269.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#dc2626" text-anchor="start" font-weight="400"><tspan>= 从 (−1, 1) 到 (n, n) 的路径数</tspan></text>
<circle cx="646.0" cy="295.0" r="3.4" fill="#dc2626" stroke="none" stroke-width="1.0" opacity="1.00"/>
<text x="658.0" y="300.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14.5" fill="#0f172a" text-anchor="start" font-weight="400"><tspan>　↳ 需要 n+1 个 E、n−1 个 N</tspan></text>
<text x="658.0" y="321.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#dc2626" text-anchor="start" font-weight="400"><tspan>C(2n, n−1) = C(8, 3) = 56</tspan></text>
<circle cx="646.0" cy="347.0" r="3.4" fill="#2563eb" stroke="none" stroke-width="1.0" opacity="1.00"/>
<text x="658.0" y="352.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14.5" fill="#0f172a" text-anchor="start" font-weight="400"><tspan>合法的 Dyck 路径</tspan></text>
<text x="658.0" y="373.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="400"><tspan>C</tspan><tspan font-size="9.4" dy="3.2">n</tspan><tspan font-size="13.5" dy="-3.2">​</tspan><tspan> = 70 − 56 = 14  ✓</tspan></text>
<line x1="642.0" y1="422.0" x2="962.0" y2="422.0" stroke="#cbd5e1" stroke-width="1.2" opacity="1.00"/>
<text x="642.0" y="452.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15.5" fill="#0f172a" text-anchor="start" font-weight="700"><tspan>为什么是双射？</tspan></text>
<text x="642.0" y="478.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="400"><tspan>· 反射段与 P 之后的段拼起来，步型不变，</tspan></text>
<text x="642.0" y="500.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="400"><tspan>  仍然是一条格点路径；</tspan></text>
<text x="642.0" y="522.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="400"><tspan>· 反过来，从 (−1,1) 到 (n,n) 的任意路径，</tspan></text>
<text x="642.0" y="544.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="400"><tspan>  因 y − x − 1 由 +1 变到 −1，必经过</tspan></text>
<text x="642.0" y="566.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="400"><tspan>  y = x + 1，取首次交点再反射即得原路径。</tspan></text>
</svg>
