<text x="598.0" y="213.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#dc2626" text-anchor="start" font-weight="400"><tspan>→ 有 C</tspan><tspan font-size="9.4" dy="3.2">k-1</tspan><tspan font-size="13.5" dy="-3.2">​</tspan><tspan> 种（k = 2 → C</tspan><tspan font-size="9.4" dy="3.2">1</tspan><tspan font-size="13.5" dy="-3.2">​</tspan><tspan> = 1）</tspan></text>
<circle cx="586.0" cy="249.0" r="3.4" fill="#2563eb" stroke="none" stroke-width="1.0" opacity="1.00"/>
<text x="598.0" y="254.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14.5" fill="#0f172a" text-anchor="start" font-weight="400"><tspan>② 尾段 = (k,k) 到 (n,n) 的 Dyck 路径</tspan></text>
<text x="598.0" y="275.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="400"><tspan>→ 有 C</tspan><tspan font-size="9.4" dy="3.2">n-k</tspan><tspan font-size="13.5" dy="-3.2">​</tspan><tspan> 种（n−k = 2 → C</tspan><tspan font-size="9.4" dy="3.2">2</tspan><tspan font-size="13.5" dy="-3.2">​</tspan><tspan> = 2）</tspan></text>
<line x1="582.0" y1="320.0" x2="850.0" y2="320.0" stroke="#cbd5e1" stroke-width="1.2" opacity="1.00"/>
<text x="582.0" y="350.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14.5" fill="#0f172a" text-anchor="start" font-weight="400"><tspan>本例：C</tspan><tspan font-size="10.1" dy="3.2">1</tspan><tspan font-size="14.5" dy="-3.2">​</tspan><tspan> × C</tspan><tspan font-size="10.1" dy="3.2">2</tspan><tspan font-size="14.5" dy="-3.2">​</tspan><tspan> = 1 × 2 = 2</tspan></text>
<text x="582.0" y="376.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14.5" fill="#0f172a" text-anchor="start" font-weight="400"><tspan>对所有 k 求和即得</tspan></text>
<text x="582.0" y="400.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15.5" fill="#7c3aed" text-anchor="start" font-weight="700"><tspan>C</tspan><tspan font-size="10.8" dy="3.2">n</tspan><tspan font-size="15.5" dy="-3.2">​</tspan><tspan> = Σ C</tspan><tspan font-size="10.8" dy="3.2">k-1</tspan><tspan font-size="15.5" dy="-3.2">​</tspan><tspan> C</tspan><tspan font-size="10.8" dy="3.2">n-k</tspan><tspan font-size="15.5" dy="-3.2">​</tspan></text>
<text x="150.0" y="570.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14.0" fill="#64748b" text-anchor="start" font-weight="400"><tspan>红框内为中间段：去掉首尾的 E、N 后平移 (−1, 0)，即 (0,0) → (k−1, k−1) 的 Dyck 路径</tspan></text>
