<text x="28.0" y="42.0" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="21.0" fill="#0f172a" text-anchor="start" font-weight="700"><tspan>按「首次返回对角线」分解：C</tspan><tspan font-size="14.7" dy="3.2">n</tspan><tspan font-size="21.0" dy="-3.2">​</tspan><tspan> = Σ</tspan><tspan font-size="14.7" dy="3.2">k=1..n</tspan><tspan font-size="21.0" dy="-3.2">​</tspan><tspan> C</tspan><tspan font-size="14.7" dy="3.2">k-1</tspan><tspan font-size="21.0" dy="-3.2">​</tspan><tspan> · C</tspan><tspan font-size="14.7" dy="3.2">n-k</tspan><tspan font-size="21.0" dy="-3.2">​</tspan></text>
